<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مهمة إطلاق الصاروخ | تحدي الحساب</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 45%,#253e89 0%,#101c4a 65%,#080e27 100%);font-family:Tahoma,Arial,sans-serif;color:#fff;text-align:center;overflow-x:hidden}.sky{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff9 1.3px,transparent 2px),radial-gradient(#fff8 1px,transparent 2px);background-size:91px 91px,137px 137px;background-position:15px 23px,75px 69px;animation:twinkle 4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.5}}h1{position:relative;margin:14px 0 4px;color:#ffe47b;font-size:clamp(24px,4.5vw,39px)}.subtitle{position:relative;margin:4px 12px 10px;font-size:clamp(15px,2.5vw,19px)}.layout{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,48px);flex-wrap:wrap;padding:4px 12px}.rocket-wrap{width:clamp(240px,33vw,350px);height:565px;position:relative;flex-shrink:0}.rocket-assembly{position:absolute;left:50%;top:0;transform:translateX(-50%);width:260px;height:535px;animation:hover 2.4s ease-in-out infinite;filter:drop-shadow(0 14px 13px #0006)}@keyframes hover{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1deg)}50%{transform:translateX(-50%) translateY(-8px) rotate(1deg)}}.rocket-assembly.launch{animation:blast 3.2s cubic-bezier(.65,0,.8,.5) forwards}@keyframes blast{0%{transform:translateX(-50%) translateY(0)}20%{transform:translateX(-50%) translateY(8px)}100%{transform:translateX(-50%) translateY(-1100px)}}.nose{position:absolute;top:3px;left:59px;width:142px;height:115px;background:linear-gradient(100deg,#e7406e,#ff8297 45%,#d52b59);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:55% 55% 0 0}.rocket-body{position:absolute;top:96px;left:46px;width:168px;height:352px;border:7px solid #b7d9ff;border-radius:44px 44px 35px 35px;background:linear-gradient(90deg,#9ec4f4,#f8fbff 28%,#fff 70%,#9ec4f4);box-shadow:inset -10px 0 18px #4965a13b}.fin{position:absolute;top:350px;width:70px;height:108px;background:#ff6585}.fin.left{left:0;clip-path:polygon(100% 0,100% 100%,0 100%,15% 38%)}.fin.right{right:0;clip-path:polygon(0 0,100% 38%,100% 100%,0 100%)}.rocket-window{position:absolute;top:112px;left:97px;width:67px;height:67px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#c8ffff,#59bdf7 70%);border:7px solid #487ab7;box-shadow:inset 3px 4px 6px #fff8}.rocket-title{position:absolute;top:181px;left:50%;transform:translateX(-50%);font-size:13px;color:#284879;font-weight:bold;white-space:nowrap}.slots{position:absolute;top:206px;left:70px;width:120px;height:224px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr);gap:4px;direction:rtl}.slot{display:grid;place-items:center;border:2px dashed #719ed1;border-radius:9px;background:#d5e7ffb8;color:#647ea2;font-size:25px;font-weight:900;cursor:pointer;user-select:none}.slot.filled{background:#fff0a9;color:#233b72;border:2px solid #ffb642}.engine{position:absolute;top:443px;left:88px;width:84px;height:23px;border-radius:0 0 18px 18px;background:#778da9}.flame{position:absolute;top:460px;left:93px;width:74px;height:95px;background:linear-gradient(#fff2a1 10%,#ffb631 45%,#ff4e2f 80%,transparent);clip-path:polygon(10% 0,90% 0,75% 30%,100% 57%,60% 100%,43% 73%,15% 100%,0 49%);transform-origin:top center;animation:flame .27s ease-in-out infinite alternate;filter:drop-shadow(0 0 12px #ff8c00)}@keyframes flame{to{transform:scaleX(.77) scaleY(1.15);opacity:.75}}.rocket-assembly.launch .flame{height:170px;filter:drop-shadow(0 0 30px #ffbd00)}.smoke{position:absolute;bottom:0;left:0;right:0;font-size:44px;opacity:.45;animation:smoke 1.7s infinite alternate}@keyframes smoke{to{opacity:.8;transform:scale(1.15)}}.panel{width:min(530px,96vw);background:#ffffff12;border:2px solid #ffffff3b;border-radius:22px;padding:16px 12px;box-shadow:0 10px 30px #0003}.status{min-height:50px;color:#ffe78b;font-size:20px;font-weight:bold}.tiles{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:16px auto;max-width:490px}.tile{width:70px;height:66px;border:3px solid white;border-radius:14px;background:linear-gradient(140deg,#ffe69c,#ffab52);box-shadow:0 5px 0 #b76937;color:#192c66;font-size:35px;font-weight:900;cursor:pointer;touch-action:manipulation}.tile.used{visibility:hidden}.tile:active{transform:translateY(3px)}button{border:0;border-radius:14px;padding:12px 20px;font-family:inherit;font-size:18px;font-weight:bold;cursor:pointer;background:#70e4bf;color:#103d44}button.alt{background:#d8e8ff;color:#243b70}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.count{font-size:65px;font-weight:900;color:#ffe581;min-height:80px;text-shadow:0 0 25px #ff9e3a}.small{font-size:14px;color:#d8e7ff;line-height:1.8}.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;top:-50px;font-size:32px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}@media(max-width:640px){.rocket-wrap{height:545px}.layout{gap:0}.panel{margin-bottom:20px}.tile{width:58px;height:58px;font-size:30px}}
</style></head><body><div class="sky"></div><h1>🚀 مهمة الإطلاق!</h1><p class="subtitle">رتّب الأرقام داخل الصاروخ من ٩ إلى ٠ حتى ينطلق!</p><main class="layout"><div class="rocket-wrap"><div class="rocket-assembly" id="rocket"><div class="nose"></div><div class="fin left"></div><div class="fin right"></div><div class="rocket-body"></div><div class="rocket-window"></div><div class="rocket-title">لوحة العد التنازلي</div><div class="slots" id="slots"></div><div class="engine"></div><div class="flame"></div></div><div class="smoke">☁️ ☁️</div></div><section class="panel"><div class="status" id="status" aria-live="polite">اختر رقمًا ليظهر داخل الصاروخ!</div><div class="tiles" id="tiles"></div><div class="buttons"><button id="check">🚀 جاهز للإطلاق!</button><button class="alt" id="reset">↻ محاولة جديدة</button><button class="alt" id="sound">🔊 الصوت يعمل</button></div><div class="count" id="count"></div><p class="small">اضغط على الأرقام بالترتيب الذي تختاره؛ ستملأ الخانات داخل الصاروخ من اليمين إلى اليسار، ومن الأعلى للأسفل. اضغط على أي خانة لإزالة رقمها.</p></section></main><div class="burst" id="burst"></div><script>
const numbers=['٩','٨','٧','٦','٥','٤','٣','٢','١','٠'];let placed=Array(10).fill(null),playing=false,muted=false,ctx,epoch=0;const slots=document.getElementById('slots'),tiles=document.getElementById('tiles'),status=document.getElementById('status'),count=document.getElementById('count'),rocket=document.getElementById('rocket');function tone(freq=600,dur=.13,type='sine',vol=.12){if(muted)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}// Engine roar: layered, filtered broadband noise and low-frequency rumble.
let engineNodes=[];
function stopEngine(){for(const node of engineNodes){try{node.stop?.()}catch(e){}try{node.disconnect?.()}catch(e){}}engineNodes=[]}
function engineRoar(){
 if(muted)return;
 try{
  ctx??=new(window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended')ctx.resume();
  stopEngine();
  const now=ctx.currentTime,duration=3.7,sampleRate=ctx.sampleRate;
  const buffer=ctx.createBuffer(1,Math.ceil(sampleRate*duration),sampleRate);
  const samples=buffer.getChannelData(0);
  let last=0;
  for(let i=0;i<samples.length;i++){const white=Math.random()*2-1;last=(last+0.045*white)/1.045;samples[i]=white*.65+last*2.4}
  const source=ctx.createBufferSource();source.buffer=buffer;
  const lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.setValueAtTime(180,now);lowpass.frequency.exponentialRampToValueAtTime(1100,now+1.2);lowpass.frequency.exponentialRampToValueAtTime(450,now+duration);
  const gain=ctx.createGain();gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.30,now+.75);gain.gain.setValueAtTime(.30,now+1.8);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  source.connect(lowpass);lowpass.connect(gain);gain.connect(ctx.destination);
  source.start(now);source.stop(now+duration);engineNodes.push(source);
  const osc=ctx.createOscillator(),oscGain=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(42,now);osc.frequency.exponentialRampToValueAtTime(74,now+1.2);osc.frequency.exponentialRampToValueAtTime(48,now+duration);
  oscGain.gain.setValueAtTime(.001,now);oscGain.gain.exponentialRampToValueAtTime(.075,now+.7);oscGain.gain.setValueAtTime(.075,now+1.8);oscGain.gain.exponentialRampToValueAtTime(.001,now+duration);
  osc.connect(oscGain);oscGain.connect(ctx.destination);osc.start(now);osc.stop(now+duration);engineNodes.push(osc);
 }catch(e){}
}
function mix(){let a=[...numbers];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let order=mix();function render(){slots.innerHTML='';placed.forEach((v,i)=>{let s=document.createElement('div');s.className='slot'+(v!==null?' filled':'');s.textContent=v??'؟';s.setAttribute('role','button');s.setAttribute('aria-label','الخانة '+(i+1));s.onclick=()=>{if(playing)return;if(placed[i]!==null){placed[i]=null;tone(350);render()}};slots.append(s)});tiles.innerHTML='';order.forEach(v=>{let b=document.createElement('button');b.className='tile'+(placed.includes(v)?' used':'');b.textContent=v;b.disabled=placed.includes(v)||playing;b.onclick=()=>{if(playing)return;let idx=placed.indexOf(null);if(idx<0)return;placed[idx]=v;tone(520+idx*40,.12,'triangle');render();if(!placed.includes(null))status.textContent='اكتملت الخانات! اضغط جاهز للإطلاق 🚀'};tiles.append(b)})}function delay(ms){return new Promise(r=>setTimeout(r,ms))}function stars(){let area=document.getElementById('burst');for(let i=0;i<65;i++){let e=document.createElement('span');e.className='spark';e.textContent=['⭐','✨','🌟','🎉'][i%4];e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*1.6+'s';area.append(e);setTimeout(()=>e.remove(),4800)}}async function launch(){let id=++epoch;playing=true;status.textContent='أحسنت! استعد للعد التنازلي!';stars();for(let i=0;i<10;i++){if(id!==epoch)return;count.textContent=numbers[i];tone(490+i*45,.21,'triangle');await delay(620)}if(id!==epoch)return;count.textContent='انطلاق! 🚀';engineRoar();rocket.classList.add('launch');await delay(950);if(id!==epoch)return;status.textContent='🏆 رائع! نجحت مهمة إطلاق الصاروخ!';for(let i=0;i<4;i++){tone(660+i*160,.19,'sine');await delay(190)}}document.getElementById('check').onclick=()=>{if(playing)return;if(placed.includes(null)){status.textContent='أكمل الأرقام العشرة داخل الصاروخ أولًا';tone(220,.2);return}if(placed.every((v,i)=>v===numbers[i]))launch();else{status.textContent='محاولة جميلة! راجع ترتيب الأرقام من ٩ إلى ٠';tone(250,.24,'triangle')}};document.getElementById('reset').onclick=()=>{epoch++;stopEngine();placed=Array(10).fill(null);playing=false;order=mix();rocket.classList.remove('launch');count.textContent='';status.textContent='اختر رقمًا ليظهر داخل الصاروخ!';render()};document.getElementById('sound').onclick=()=>{muted=!muted;if(muted)stopEngine();document.getElementById('sound').textContent=muted?'🔇 الصوت متوقف':'🔊 الصوت يعمل';if(!muted)tone(650)};render();
</script></body></html>
